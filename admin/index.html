<script>
(function() {
    function getStoredCreds() {
        try {
            var raw = localStorage.getItem("ukvisa_admin_credentials");
            if (raw) {
                var p = JSON.parse(raw);
                if (p && p.username && p.password) return p;
            }
        } catch(e) {}
        return { username: "admin", password: "ukvisa2026" };
    }

    function createModal() {
        if (document.getElementById('pwd-modal-overlay')) return;
        var creds = getStoredCreds();
        var overlay = document.createElement('div');
        overlay.id = 'pwd-modal-overlay';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(11,31,58,0.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;';
        
        overlay.innerHTML = '<div style="background:#fff;border:2px solid #AD8A34;border-top:6px solid #0B3D2E;width:100%;max-width:540px;border-radius:2px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);padding:28px;position:relative;font-family:EB Garamond, serif;color:#1E1A13;">' +
            '<button id="pwd-close-btn" style="position:absolute;top:16px;right:16px;background:#f1f5f9;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1;color:#475569;">✕</button>' +
            '<div style="margin-bottom:20px;">' +
                '<span style="font-family:Cinzel,serif;font-size:10px;font-weight:bold;letter-spacing:0.2em;color:#6B0E1A;text-transform:uppercase;display:block;">Staff Access & Authentication</span>' +
                '<h2 style="font-family:Cormorant Garamond,serif;font-size:26px;font-weight:bold;color:#0B1F3A;margin:4px 0;">Change Admin Password & Credentials</h2>' +
                '<p style="font-size:14px;color:#64748b;margin:0;">Update your administrative login username and password. Changes save immediately.</p>' +
            '</div>' +
            '<div style="background:#F7F2E7;border:1px solid #EEE3CB;padding:10px 14px;border-radius:2px;font-size:12px;font-family:Cinzel,serif;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
                '<span>Active Username: <strong id="pwd-active-user" style="color:#0B1F3A;font-size:14px;">' + creds.username + '</strong></span>' +
                '<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:2px;font-weight:bold;font-size:10px;">ACTIVE</span>' +
            '</div>' +
            '<div id="pwd-msg" style="display:none;padding:10px;border-radius:2px;font-size:12px;margin-bottom:14px;font-family:sans-serif;"></div>' +
            '<form id="pwd-change-form" style="display:flex;flex-direction:column;gap:12px;">' +
                '<div>' +
                    '<label style="display:block;font-family:Cinzel,serif;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:0.1em;color:#334155;margin-bottom:4px;">Current Password *</label>' +
                    '<input type="password" id="input-cur-pwd" required placeholder="Enter current password" style="width:100%;box-sizing:border-box;padding:8px 12px;border:1px solid #cbd5e1;border-radius:2px;font-size:13px;font-family:sans-serif;outline:none;" />' +
                '</div>' +
                '<div>' +
                    '<label style="display:block;font-family:Cinzel,serif;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:0.1em;color:#334155;margin-bottom:4px;">Login Username</label>' +
                    '<input type="text" id="input-new-user" required value="' + creds.username + '" style="width:100%;box-sizing:border-box;padding:8px 12px;border:1px solid #cbd5e1;border-radius:2px;font-size:13px;font-family:sans-serif;outline:none;" />' +
                '</div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">' +
                    '<div>' +
                        '<label style="display:block;font-family:Cinzel,serif;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:0.1em;color:#334155;margin-bottom:4px;">New Password *</label>' +
                        '<input type="password" id="input-new-pwd" required minlength="6" placeholder="Min 6 characters" style="width:100%;box-sizing:border-box;padding:8px 12px;border:1px solid #cbd5e1;border-radius:2px;font-size:13px;font-family:sans-serif;outline:none;" />' +
                    '</div>' +
                    '<div>' +
                        '<label style="display:block;font-family:Cinzel,serif;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:0.1em;color:#334155;margin-bottom:4px;">Confirm Password *</label>' +
                        '<input type="password" id="input-cnf-pwd" required placeholder="Re-enter password" style="width:100%;box-sizing:border-box;padding:8px 12px;border:1px solid #cbd5e1;border-radius:2px;font-size:13px;font-family:sans-serif;outline:none;" />' +
                    '</div>' +
                '</div>' +
                '<button type="submit" style="margin-top:6px;width:100%;background:#6B0E1A;color:#F1E6C8;border:1px solid #AD8A34;padding:12px;font-family:Cinzel,serif;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:0.14em;border-radius:2px;cursor:pointer;transition:all 0.2s;">Update Admin Password</button>' +
            '</form>' +
            '<div style="margin-top:16px;padding-top:14px;border-top:1px solid #EEE3CB;display:flex;justify-content:space-between;align-items:center;">' +
                '<span style="font-size:11px;color:#64748b;font-family:sans-serif;">Default: <strong>admin</strong> / <strong>ukvisa2026</strong></span>' +
                '<button type="button" id="pwd-reset-btn" style="background:none;border:none;color:#6B0E1A;text-decoration:underline;cursor:pointer;font-size:11px;font-family:Cinzel,serif;text-transform:uppercase;font-weight:bold;">Reset Default</button>' +
            '</div>' +
        '</div>';

        document.body.appendChild(overlay);

        document.getElementById('pwd-close-btn').onclick = function() { overlay.style.display = 'none'; };
        overlay.onclick = function(e) { if (e.target === overlay) overlay.style.display = 'none'; };

        var form = document.getElementById('pwd-change-form');
        var msgBox = document.getElementById('pwd-msg');

        form.onsubmit = function(ev) {
            ev.preventDefault();
            msgBox.style.display = 'none';
            var cur = document.getElementById('input-cur-pwd').value;
            var newUser = document.getElementById('input-new-user').value.trim() || 'admin';
            var newP = document.getElementById('input-new-pwd').value;
            var cnfP = document.getElementById('input-cnf-pwd').value;
            var active = getStoredCreds();

            if (cur !== active.password && !(active.password === 'ukvisa2026' && (cur === 'admin' || cur === 'ukvisa2026'))) {
                msgBox.style.display = 'block';
                msgBox.style.background = '#fef2f2';
                msgBox.style.color = '#b91c1c';
                msgBox.style.border = '1px solid #fecaca';
                msgBox.textContent = 'Current password is incorrect.';
                return;
            }
            if (newP.length < 6) {
                msgBox.style.display = 'block';
                msgBox.style.background = '#fef2f2';
                msgBox.style.color = '#b91c1c';
                msgBox.style.border = '1px solid #fecaca';
                msgBox.textContent = 'New password must be at least 6 characters.';
                return;
            }
            if (newP !== cnfP) {
                msgBox.style.display = 'block';
                msgBox.style.background = '#fef2f2';
                msgBox.style.color = '#b91c1c';
                msgBox.style.border = '1px solid #fecaca';
                msgBox.textContent = 'New password and confirmation do not match.';
                return;
            }

            var updated = { username: newUser, password: newP };
            localStorage.setItem('ukvisa_admin_credentials', JSON.stringify(updated));
            try {
                fetch('/api/auth.php?action=change_password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: newUser, password: newP, current_password: cur })
                }).catch(function(){});
            } catch(e) {}

            document.getElementById('pwd-active-user').textContent = newUser;
            document.getElementById('input-cur-pwd').value = '';
            document.getElementById('input-new-pwd').value = '';
            document.getElementById('input-cnf-pwd').value = '';

            msgBox.style.display = 'block';
            msgBox.style.background = '#f0fdf4';
            msgBox.style.color = '#15803d';
            msgBox.style.border = '1px solid #bbf7d0';
            msgBox.textContent = 'Password updated successfully! New password is now active.';
            alert('Password changed successfully!\nUsername: ' + newUser + '\nPlease remember your new password.');
        };

        document.getElementById('pwd-reset-btn').onclick = function() {
            if (confirm('Reset credentials back to official default (admin / ukvisa2026)?')) {
                var def = { username: 'admin', password: 'ukvisa2026' };
                localStorage.setItem('ukvisa_admin_credentials', JSON.stringify(def));
                try { fetch('/api/auth.php?action=reset_default', { method: 'POST' }).catch(function(){}); } catch(e) {}
                document.getElementById('pwd-active-user').textContent = 'admin';
                document.getElementById('input-new-user').value = 'admin';
                msgBox.style.display = 'block';
                msgBox.style.background = '#f0fdf4';
                msgBox.style.color = '#15803d';
                msgBox.style.border = '1px solid #bbf7d0';
                msgBox.textContent = 'Credentials reset to default: admin / ukvisa2026';
            }
        };
    }

    function openPasswordModal() {
        createModal();
        var overlay = document.getElementById('pwd-modal-overlay');
        if (overlay) {
            overlay.style.display = 'flex';
            var creds = getStoredCreds();
            var au = document.getElementById('pwd-active-user');
            if (au) au.textContent = creds.username;
            var inUser = document.getElementById('input-new-user');
            if (inUser) inUser.value = creds.username;
        }
    }

    function syncDashboardButtons() {
        var isAuth = sessionStorage.getItem('ukvisa_admin_session') === 'active';
        if (!isAuth) return;

        // 1. Check Header Bar for Change Password button
        var headerDiv = document.querySelector('header .max-w-\\[1280px\\] > div:last-child');
        if (!headerDiv) {
            // fallback header query
            var headers = document.querySelectorAll('header div');
            for (var i = 0; i < headers.length; i++) {
                if (headers[i].textContent.indexOf('Log Out') !== -1) {
                    headerDiv = headers[i];
                    break;
                }
            }
        }
        if (headerDiv && !document.getElementById('btn-header-pwd-inject')) {
            var btn = document.createElement('button');
            btn.id = 'btn-header-pwd-inject';
            btn.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-[2px] bg-[#D8B34A]/20 hover:bg-[#D8B34A]/30 text-[#D8B34A] text-xs font-[\'Cinzel\'] uppercase tracking-wider border border-[#AD8A34] transition-colors cursor-pointer mr-2';
            btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-[#D8B34A]"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><span>Change Password</span>';
            btn.onclick = openPasswordModal;
            var logoutBtn = headerDiv.querySelector('button');
            if (logoutBtn) {
                headerDiv.insertBefore(btn, logoutBtn);
            } else {
                headerDiv.appendChild(btn);
            }
        }

        // 2. Check Tab Bar for Password & Security tab
        var tabContainer = document.querySelector('.bg-white.border.border-\\[\\#EEE3CB\\] > div:first-child');
        if (!tabContainer) {
            var candidates = document.querySelectorAll('div');
            for (var j = 0; j < candidates.length; j++) {
                if (candidates[j].textContent.indexOf('Leads & Enquiries') !== -1 && candidates[j].textContent.indexOf('Backup & Restore') !== -1) {
                    tabContainer = candidates[j];
                    break;
                }
            }
        }
        if (tabContainer && !document.getElementById('btn-tab-pwd-inject')) {
            var tabBtn = document.createElement('button');
            tabBtn.id = 'btn-tab-pwd-inject';
            tabBtn.className = 'px-4 py-2.5 rounded-[2px] flex items-center gap-2 transition-all cursor-pointer text-slate-600 hover:bg-[#F7F2E7] hover:text-[#0B1F3A] font-[\'Cinzel\'] text-xs font-bold uppercase tracking-wider';
            tabBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-[#AD8A34]"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><span>Password & Security</span>';
            tabBtn.onclick = openPasswordModal;
            tabContainer.appendChild(tabBtn);
        }

        // 3. Sync Consultation Leads from localStorage if leads table is visible
        syncLeadsTable();
    }

    function syncLeadsTable() {
        var tbody = document.querySelector('tbody');
        if (!tbody || tbody.dataset.leadsSynced) return;
        try {
            var raw = localStorage.getItem('ukvisa_consultation_leads');
            if (!raw) return;
            var list = JSON.parse(raw);
            if (!Array.isArray(list) || list.length === 0) return;

            // Check if user submitted leads are already rendered
            var existingRows = tbody.querySelectorAll('tr');
            var firstRowText = existingRows.length > 0 ? existingRows[0].textContent : '';
            var firstLead = list[0];
            if (firstRowText.indexOf(firstLead.name) !== -1) {
                tbody.dataset.leadsSynced = 'true';
                return;
            }

            // Prepend new leads that aren't yet in table
            list.forEach(function(lead) {
                var found = false;
                for (var k = 0; k < existingRows.length; k++) {
                    if (existingRows[k].textContent.indexOf(lead.name) !== -1 && existingRows[k].textContent.indexOf(lead.phone) !== -1) {
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    var tr = document.createElement('tr');
                    tr.className = 'hover:bg-[#F7F2E7]/80 transition-colors bg-amber-50/50';
                    var waLink = 'https://wa.me/923088578888?text=' + encodeURIComponent('Hello ' + lead.name + ', regarding your UK visa inquiry for ' + (lead.visaRoute || 'visa'));
                    var mailLink = 'mailto:' + (lead.email || '') + '?subject=' + encodeURIComponent('UK Visa Consultation: ' + (lead.visaRoute || ''));
                    tr.innerHTML = '<td class="py-4 px-5 align-top"><strong class="font-bold text-[#0B1F3A] block text-lg font-[\'Cormorant_Garamond\']">' + (lead.name || 'Applicant') + '</strong>' +
                        '<div class="text-xs text-slate-600 font-sans space-y-0.5 mt-1">' +
                        '<div>' + (lead.phone || 'N/A') + '</div><div>' + (lead.email || 'N/A') + '</div></div></td>' +
                        '<td class="py-4 px-5 align-top"><span class="inline-block px-2.5 py-1 rounded-[2px] bg-[#0B3D2E] text-[#D8B34A] text-xs font-[\'Cinzel\'] font-bold uppercase tracking-wider">' + (lead.visaRoute || 'Visa Route') + '</span></td>' +
                        '<td class="py-4 px-5 align-top max-w-xs text-sm text-[#4A4438] leading-relaxed">' + (lead.message || '') + '</td>' +
                        '<td class="py-4 px-5 align-top text-xs text-slate-500 font-sans whitespace-nowrap">' + (lead.date || 'Recent') + '</td>' +
                        '<td class="py-4 px-5 align-top"><span class="px-2 py-1 rounded-[2px] text-xs font-[\'Cinzel\'] font-bold uppercase bg-amber-100 text-amber-800 border border-amber-300">NEW INQUIRY</span></td>' +
                        '<td class="py-4 px-5 align-top text-right whitespace-nowrap"><div class="flex items-center justify-end gap-2">' +
                        '<a href="' + waLink + '" target="_blank" class="p-2 rounded bg-emerald-100 hover:bg-emerald-200 text-emerald-800" title="Chat on WhatsApp">💬</a>' +
                        '<a href="' + mailLink + '" class="p-2 rounded bg-blue-50 hover:bg-blue-100 text-blue-800" title="Email">✉️</a>' +
                        '</div></td>';
                    if (tbody.firstChild) {
                        tbody.insertBefore(tr, tbody.firstChild);
                    } else {
                        tbody.appendChild(tr);
                    }
                }
            });
            tbody.dataset.leadsSynced = 'true';
        } catch(e) {}
    }

    // Run periodically to catch React renders
    setInterval(syncDashboardButtons, 600);
})();
</script>
</body></html>
